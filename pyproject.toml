[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rag-en-pratique"
version = "0.1.0"
description = "Code et notebooks compagnons du livre RAG en pratique"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Ahouahounko" },
]
dependencies = [
  "openai>=1,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4,<5",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]
pdf = [
  "pypdf>=5,<7",
]
app = [
  "fastapi>=0.115,<1",
  "requests>=2.32,<3",
  "streamlit>=1.40,<2",
  "uvicorn>=0.30,<1",
]
all = [
  "fastapi>=0.115,<1",
  "pypdf>=5,<7",
  "requests>=2.32,<3",
  "streamlit>=1.40,<2",
  "uvicorn>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_en_pratique"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
