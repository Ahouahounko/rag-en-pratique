[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rag-en-pratique"
version = "0.1.0"
description = "Code et notebooks compagnons du livre RAG en pratique"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Ahouahounko" },
]
dependencies = [
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
openai = [
  "openai>=1,<3",
]
huggingface = [
  "sentence-transformers>=3,<6",
  "transformers>=4.48,<6",
]
chunking = [
  "chonkie[table]>=1.6,<2",
  "langchain-text-splitters>=1,<2",
  "numpy>=2,<3",
  "tiktoken>=0.9,<1",
]
retrieval = [
  "rank-bm25>=0.2.2,<1",
]
dev = [
  "jupyterlab>=4,<5",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]
pdf = [
  "pypdf>=5,<7",
  "rank-bm25>=0.2.2,<1",
]
app = [
  "fastapi>=0.115,<1",
  "requests>=2.32,<3",
  "streamlit>=1.40,<2",
  "uvicorn>=0.30,<1",
]
all = [
  "fastapi>=0.115,<1",
  "chonkie[table]>=1.6,<2",
  "langchain-text-splitters>=1,<2",
  "numpy>=2,<3",
  "openai>=1,<3",
  "pypdf>=5,<7",
  "requests>=2.32,<3",
  "sentence-transformers>=3,<6",
  "streamlit>=1.40,<2",
  "tiktoken>=0.9,<1",
  "transformers>=4.48,<6",
  "uvicorn>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_en_pratique"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
