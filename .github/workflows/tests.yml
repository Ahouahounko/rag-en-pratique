name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer le projet
        run: pip install -e ".[dev,chunking,prompting,retrieval,vectorstores]"
      - name: Vérifier le style
        run: >-
          ruff check
          src
          tests
          tools
          chapters/chapitre-02-premier-rag/runnable
          chapters/chapitre-03-donnees-et-chunking/examples
          chapters/chapitre-03-donnees-et-chunking/runnable
          chapters/chapitre-04-retrieval-avance/examples
          chapters/chapitre-04-retrieval-avance/runnable
          chapters/chapitre-05-bases-vectorielles/examples
          chapters/chapitre-05-bases-vectorielles/runnable
          chapters/chapitre-06-prompt-engineering/examples
          chapters/chapitre-06-prompt-engineering/runnable
          chapters/chapitre-07-evaluation/examples
          chapters/chapitre-07-evaluation/runnable
          chapters/chapitre-09-docurag/runnable
      - name: Exécuter les tests
        run: pytest
