name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer le projet
        run: pip install -e ".[dev]"
      - name: Vérifier le style
        run: >-
          ruff check
          src
          tests
          tools
          chapters/chapitre-02-premier-rag/runnable
          chapters/chapitre-09-docurag/runnable
      - name: Exécuter les tests
        run: pytest
